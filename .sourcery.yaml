# Sourcery configuration for Chathook
# Scope: Python backend only (src/, main.py, scripts/, tests/).
# CodeRabbit handles overall reviews; Sourcery focuses on deep refactor
# suggestions on Python code.
#
# Run with: `sourcery review src main.py scripts tests`
# (the CLI / pre-commit hook picks up sources from args, not from this file)

# Only review Python source code; ignore everything else.
ignore:
  - "dashboard/**"
  - "data/**"
  - ".github/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - ".venv/**"
  - ".git/**"
  - "**/*.generated.py"
  - "**/migrations/**"

# Standard strictness: balance noise vs coverage.
rule_settings:
  python_version: "3.14"

  # Only refactor + suggestion categories. Comments are off to avoid
  # duplicating what CodeRabbit already says.
  rule_types:
    - refactoring
    - suggestion

  # Enable all default rules plus the entire optional rule set.
  # We deliberately do NOT list individual rule IDs here: Sourcery has no
  # built-in 'security' / 'bandit' tags, and guessing IDs triggers schema
  # warnings. If a specific optional rule needs enabling later, add its
  # exact ID (e.g. 'gpsg-naming-pep8', 'no-debug', 'no-long-functions').
  enable:
    - default
    - optional

  # Only disable rules whose exact IDs appear in Sourcery's official rule
  # reference. Avoid guessing IDs - unknown ones fail schema validation.
  # Style/docstring/length concerns are intentionally NOT disabled here;
  # ruff + CodeRabbit already enforce them, and Sourcery won't re-flag
  # the default rules for the same code.
  disable:
    - for-append-to-extend
    - raise-from-previous-error

# Track PR-time reviews only. `sourcery review --diff "git diff main"` style.
# This block is informational; Sourcery CLI reads diffs from the command line.
github:
  labels: []
  ignore_labels:
    - sourcery-ignore

# Block noisy legacy comment suggestions.
metrics:
  quality_threshold: 40.0
