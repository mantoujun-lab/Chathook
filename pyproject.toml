[project]
name = "chathook"
version = "1.1.0"
description = "聊天向 Webhook 中转站 - 接收, 转换, 转发多平台 Webhook 消息"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "loguru",
]

[project.optional-dependencies]

[project.scripts]
bump = "bump_version:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/chat、src/webhook 通过 sources=[src] 去掉 src 前缀; scripts/bump_version.py
# 通过 sources=[scripts] 去掉 scripts 前缀, 使 bump_version 成为顶层模块.
# 相比 force-include, 这种方式在 editable 安装下不会把脚本复制到 site-packages,
# 因此 `uv run bump` 始终执行最新源码, 修改脚本后无需重新安装.
[tool.hatch.build.targets.wheel]
only-include = ["src/chat", "src/webhook", "scripts/bump_version.py"]
sources = ["src", "scripts"]
dev-mode-dirs = ["src", "scripts"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 显式指定测试目录, 避免在某些环境 (如 CI 安装为 wheel 后) 下 pytest
# 扫不到 tests/test_health.py 导致 "collected 0 items" 退出码 5
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# 把项目根目录加到 sys.path 头部, 使 `from main import app` 在 CI 上也能工作
pythonpath = ["."]
