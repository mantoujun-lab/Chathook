[project]
name = "chathook"
version = "0.1.0"
description = "聊天向 Webhook 中转站 - 接收, 转换, 转发多平台 Webhook 消息"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "loguru",
]

[project.optional-dependencies]

[project.scripts]
bump = "bump_version:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat", "src/webhook"]

# 将根目录的 bump_version.py 作为顶层模块打入安装包, 供 `uv run bump` 使用
[tool.hatch.build.targets.wheel.force-include]
"bump_version.py" = "bump_version.py"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]
