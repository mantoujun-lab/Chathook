# This workflow is adapted from GitHub official starter templates:
# - Python: https://github.com/actions/starter-workflows/blob/main/ci/python-app.yml
# - Node.js: https://github.com/actions/starter-workflows/blob/main/ci/node.js.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv
        # 注意: astral-sh/setup-uv 仓库没有维护 vN 这种纯主版本 moving tag
        # (只有 v7.6 / v7.5 这种 minor 级 moving tag), 必须使用精确 patch 版本.
        # 升级时改为更新的 vN.N.N 即可, 参见:
        # https://github.com/astral-sh/setup-uv/releases
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Test with pytest
        run: uv run pytest

  frontend:
    name: Frontend (Nuxt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build
