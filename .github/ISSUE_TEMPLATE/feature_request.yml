name: ✨ 功能请求
description: 提出新功能或改进建议。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 功能概述
      description: 一句话概括建议的功能。
      placeholder: 例如：增加企业微信 Webhook 适配器。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 问题与动机
      description: 这个功能要解决什么问题？谁能从中受益？请附上相关 Issue 或讨论链接。

  - type: textarea
    id: solution
    attributes:
      label: 方案描述
      description: 详细描述期望的行为、API 形态或界面变化。
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: 使用示例
      description: 展示用户将如何使用该功能。

  - type: checkboxes
    id: components
    attributes:
      label: 受影响的组件
      options:
        - label: "后端：`src/chat/`"
        - label: "后端：`src/webhook/`"
        - label: "在 `src/webhook/adapters/` 下新增适配器"
        - label: "API 接口（`src/webhook/api.py`）"
        - label: "管理面板 UI（`dashboard/app/pages/`）"
        - label: "配置模型（`src/webhook/schema.py`）"
        - label: "测试用例（`tests/`）"
        - label: "文档（`README.md`、`AGENTS.md`）"
        - label: "其他（请在下方说明）"

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 列出你考虑过的其他方案，并说明为何选择当前这个。

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 原型图、截图、参考资料或相关项目。

  - type: dropdown
    id: willingness
    attributes:
      label: 参与意愿
      options:
        - 我愿意为此功能提交 PR
        - 希望得到实现上的帮助
        - 只是建议，欢迎其他人认领
    validations:
      required: true
