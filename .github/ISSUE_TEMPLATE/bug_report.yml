name: 🐛 问题反馈
description: 反馈 Bug 或异常行为。
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 Bug 是什么。
      placeholder: 例如：在 Windows 上启动后端后，发送消息到飞书 webhook 返回 500。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 列出从零开始触发该 Bug 的最小步骤。
      placeholder: |
        1. 执行 `uv run uvicorn main:app --reload`
        2. 调用 `POST /api/send` ...
        3. 观察返回结果
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么。
      placeholder: 例如：接口返回 200，并成功将消息投递到飞书。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么，请附上错误信息或截图链接。
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 受影响平台 / 组件
      description: 该 Bug 出现在哪个平台或组件？
      options:
        - 飞书 (Feishu)
        - 钉钉 (DingTalk)
        - 自定义 Webhook
        - 管理面板
        - 后端 API
        - 其他
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11、Ubuntu 22.04、macOS 14

  - type: input
    id: chathook-version
    attributes:
      label: Chathook 版本
      placeholder: 例如 v0.1.0 或 commit SHA

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      placeholder: 例如 3.14.0

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本（仅前端相关 Bug 填写）
      placeholder: 例如 24.0.0

  - type: input
    id: install
    attributes:
      label: 安装方式
      placeholder: uv sync、pip、Docker 等

  - type: textarea
    id: config
    attributes:
      label: 相关配置（请脱敏）
      description: 贴出 `data/webhooks.json` 中的相关条目，并抹掉敏感信息。切勿提交真实的 Webhook 地址或签名密钥。
      placeholder: |
        ```json
        {
          "platform": "feishu",
          "id": "示例-id",
          "secret": "已脱敏"
        }
        ```

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 粘贴后端（loguru）或浏览器控制台的相关输出。
      placeholder: |
        ```
        2026-09-04 12:00:00 | ERROR | ...
        ```

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 相关 PR、历史 Issue、尝试过的临时方案等。
